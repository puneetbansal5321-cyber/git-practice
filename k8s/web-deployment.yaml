apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: puneet9652/git-clone-test-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
