name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run test
        run: ./test.sh

      - name: Build application
        run: ./build.sh

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f k8s/web-deployment.yaml
          kubectl apply --dry-run=client -f k8s/web-service.yaml

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t puneet9652/git-clone-test-web:latest .

      - name: Push Docker image
        run: docker push puneet9652/git-clone-test-web:latest
