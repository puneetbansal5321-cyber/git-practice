name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run test
        run: ./test.sh

      - name: Build application
        run: ./build.sh

      - name: Build Docker image
        run: docker build -t git-clone-test-web:ci .
